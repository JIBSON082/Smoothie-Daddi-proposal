<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4DE">
<title>Smoothie Daddi | Website Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<noscript><style>#splash{display:none}.rv{opacity:1!important;translate:none!important}.ch{transform:none!important}</style></noscript>
<style>
:root{
  --paper:#FFF4DE;--card:#FFFCF4;--ink:#1F1409;--mut:#6B5840;
  --mango:#FFB627;--tang:#FF5E34;--mint:#8ED6A8;--pink:#FFA3B5;
  --acc:var(--mango);--deep:#F08A00;
  --r:24px;--ease:cubic-bezier(.2,.8,.2,1);
  --serif:'Fraunces','Iowan Old Style',Georgia,serif;
  --sans:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);overflow-x:hidden;overflow-x:clip;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:800;opacity:.2;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
h1,h2,h3{font-family:var(--serif);font-optical-sizing:auto}
em{font-family:var(--serif);font-style:italic;font-weight:500}
a{color:inherit}
button{font-family:inherit;color:inherit;cursor:pointer}
#prog{position:fixed;top:0;left:0;height:4px;width:0;background:var(--tang);z-index:850;border-radius:0 4px 4px 0}

/* ---------- splash + wipe ---------- */
#splash{position:fixed;inset:0;z-index:1000;background:var(--ink);color:var(--paper);display:grid;place-items:center;transition:transform .95s cubic-bezier(.7,0,.2,1),border-radius .95s;will-change:transform}
#splash.out{transform:translateY(-105%);border-radius:0 0 50% 50%/0 0 14% 14%}
.sp-in{text-align:center;padding:0 20px}
.sp-cup{width:min(44vw,180px);height:auto;display:block;margin:0 auto 20px;overflow:visible}
.sp-t{font-family:var(--serif);font-size:clamp(36px,11vw,60px);font-weight:800;letter-spacing:-.035em;line-height:1;opacity:0;transform:translateY(14px);animation:up .8s .5s var(--ease) forwards}
.sp-t em{color:var(--mango)}
.sp-s{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:0;margin-top:12px;animation:up .8s .8s var(--ease) forwards}
@keyframes up{to{opacity:.65;transform:none}}
.sp-t{--o:1}
#skip{position:absolute;right:18px;top:calc(16px + env(safe-area-inset-top));font:500 12px var(--mono);color:var(--paper);background:none;border:1.5px solid rgba(255,244,222,.4);border-radius:99px;padding:7px 15px}
.wipe{position:fixed;inset:0;z-index:900;display:grid;place-items:center;transform:translateY(101%);pointer-events:none;font-family:var(--serif);font-size:clamp(48px,15vw,120px);font-weight:800;letter-spacing:-.035em;border-radius:50% 50% 0 0/14% 14% 0 0}
.wipe em{font-weight:500}
.wipe.in{transition:transform .5s cubic-bezier(.7,0,.2,1);transform:none;border-radius:0}
.wipe.out{transition:transform .6s cubic-bezier(.7,0,.2,1) .12s;transform:translateY(-101%);border-radius:0 0 50% 50%/0 0 14% 14%}

.view{display:none;min-height:100vh}
.view.on{display:block}
.wrap{max-width:1040px;margin:auto;padding:0 20px}

/* reveal (uses `translate` so `transform` stays free) */
.rv{opacity:0;translate:0 24px;transition:opacity .7s ease,translate .8s var(--ease)}
.rv.in{opacity:1;translate:0 0}

/* split headline */
.w{display:inline-block;white-space:nowrap;overflow:hidden;vertical-align:top;padding:0 .02em .14em;margin-bottom:-.14em}
.ch{display:inline-block;transform:translateY(108%)}
.ready .view.on .ch{animation:chup .95s var(--ease) both;animation-delay:calc(var(--i)*38ms + .1s)}
@keyframes chup{from{transform:translateY(108%) rotate(6deg)}to{transform:none}}

/* liquid cups */
.cupv{display:block;overflow:visible}
.cupv .liq{transform:translateY(310px);transition:transform 2s var(--ease)}
.cupv.in .liq{transform:translateY(var(--ty))}
.wv{animation:wvA 3.4s linear infinite}.wv2{animation:wvB 5s linear infinite}
@keyframes wvA{to{transform:translateX(-100px)}}@keyframes wvB{to{transform:translateX(100px)}}
.bub{animation:bub 3.6s ease-in infinite;animation-delay:var(--d,0s);opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}18%{opacity:.7}100%{transform:translateY(-46px);opacity:0}}

/* floating fruit */
.fx{position:absolute;transform:translate3d(calc(var(--px,0)*var(--k,1)*28px),calc(var(--py,0)*var(--k,1)*28px + var(--sy,0)*var(--k,1)*-.06px),0) rotate(var(--r,0deg));will-change:transform}
.fx i{display:block;animation:flt 7s ease-in-out infinite;animation-delay:var(--d,0s)}
.fx svg{display:block;width:100%;height:auto;filter:drop-shadow(3px 5px 0 rgba(31,20,9,.2))}
@keyframes flt{50%{transform:translateY(-13px) rotate(5deg)}}

.wdiv{overflow:hidden;line-height:0;height:38px;position:absolute;left:0;right:0}
.wdiv svg{display:block;width:200%;height:100%;animation:wvx 10s linear infinite}
@keyframes wvx{to{transform:translateX(-25%)}}

/* ---------- HOME ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px 0;max-width:1040px;margin:auto;font-size:12px;position:relative;z-index:5}
.pill{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:99px;padding:6px 13px;background:var(--card);font-weight:600;font-size:12px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--tang);display:block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.mono{font-family:var(--mono);letter-spacing:.04em}
.kick{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

.hero{position:relative;max-width:1040px;margin:auto;padding:30px 20px 86px;display:grid;gap:10px}
.mark{font-size:clamp(56px,17.4vw,190px);font-weight:800;line-height:.86;letter-spacing:-.04em;margin:18px 0 22px}
.mark .dd{position:relative;display:inline-block;color:var(--tang);padding-right:.06em}
.sq{position:absolute;left:0;bottom:-.04em;width:100%;height:.17em;overflow:visible}
.sq path{fill:none;stroke:var(--mango);stroke-width:8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.ready .view.on .sq path{animation:draw 1.3s 1.1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.addr{font-weight:500;color:var(--mut);font-size:14.5px;margin-bottom:18px}
.lead{max-width:500px;font-family:var(--serif);font-size:clamp(20px,5.2vw,26px);line-height:1.3;font-weight:400}
.cta1{margin-top:26px;display:inline-flex;align-items:center;gap:12px;border:2.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:99px;padding:8px 8px 8px 24px;font-weight:700;font-size:15px;box-shadow:4px 4px 0 var(--tang);transition:transform .2s,box-shadow .2s;justify-self:start}
.cta1 span{width:40px;height:40px;border-radius:50%;background:var(--mango);color:var(--ink);display:grid;place-items:center;animation:nudge 1.8s ease-in-out infinite}
.cta1 svg{width:18px}
@keyframes nudge{50%{transform:translateY(4px)}}
.cta1:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--tang)}
.art{position:relative;height:clamp(330px,96vw,520px);margin-top:14px}
.art .cupv{position:absolute;left:50%;top:50%;height:86%;aspect-ratio:2/3;width:auto;translate:-50% -50%;rotate:-5deg;animation:bobc 6s ease-in-out infinite}
@keyframes bobc{50%{translate:-50% calc(-50% - 10px)}}
.art::before{content:'';position:absolute;left:50%;top:50%;width:min(78vw,400px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:var(--mango);border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.art::after{content:'';position:absolute;left:50%;top:50%;width:min(94vw,480px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px dashed rgba(31,20,9,.35);animation:spin 40s linear infinite}
.badge{position:absolute;right:2%;bottom:2%;width:clamp(86px,22vw,128px);animation:spin 22s linear infinite;z-index:3}
@keyframes spin{to{rotate:360deg}}
.scroll{position:absolute;left:20px;bottom:34px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:none}

.marq{position:relative;z-index:3;background:var(--mango);border-block:2.5px solid var(--ink);overflow:hidden;white-space:nowrap;transform:rotate(-1.6deg);margin:0 -14px;box-shadow:0 7px 0 var(--ink)}
.marq div{display:inline-block;padding:12px 0;font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.02em;animation:mq 32s linear infinite}
.marq span{margin:0 16px}.marq b{display:inline-block;font-weight:400;animation:spin 9s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}

.panel{position:relative;z-index:2;background:var(--ink);color:var(--paper);margin-top:-22px;padding:92px 0 60px}
.pin{max-width:1040px;margin:auto;padding:0 20px}
.h2{font-size:clamp(40px,10.5vw,76px);font-weight:800;line-height:.94;letter-spacing:-.035em}
.h2 em{color:var(--mango)}
.sub2{color:rgba(255,244,222,.68);margin:12px 0 26px;font-size:15.5px;max-width:460px}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;margin:0 -20px;padding:10px 20px 34px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.dots button{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,244,222,.3);transition:.3s;padding:0}
.dots button.on{width:30px;background:var(--mango)}

.pc{position:relative;display:flex;flex-direction:column;flex:0 0 min(84vw,370px);scroll-snap-align:start;background:var(--acc);color:var(--ink);border-radius:30px;box-shadow:7px 7px 0 var(--deep);text-decoration:none;overflow:hidden;
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .25s ease,scale .25s var(--ease),box-shadow .25s,opacity .7s ease,translate .8s var(--ease)}
.pc:active{scale:.98}
.pc-art{position:relative;height:262px;display:grid;place-items:center;overflow:hidden}
.pc-art::before{content:'';position:absolute;width:218px;height:218px;border-radius:50%;background:rgba(255,252,244,.55);top:26px}
.pc-art .cupv{position:relative;height:226px;width:auto;aspect-ratio:2/3;rotate:-5deg}
.pc .big{position:absolute;left:16px;top:8px;font-family:var(--serif);font-weight:800;font-size:92px;line-height:1;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px rgba(31,20,9,.28)}
.pc .fl{position:absolute;right:16px;top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:99px;padding:5px 11px;rotate:4deg}
.pc-body{padding:4px 22px 22px;display:flex;flex-direction:column;flex:1}
.pc .tg{align-self:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:3px 13px;font-size:12px;font-weight:700;margin-bottom:12px}
.pc h3{font-size:27px;line-height:1.02;font-weight:800;letter-spacing:-.03em;margin-bottom:10px}
.pc p.b{font-size:14.5px;line-height:1.5;margin-bottom:14px;color:rgba(31,20,9,.8)}
.pc ul{list-style:none;display:grid;gap:7px;margin-bottom:18px;font-size:13.5px;font-weight:600}
.pc li{display:flex;gap:9px;align-items:flex-start}
.pc li::before{content:'';flex:none;width:17px;height:17px;border-radius:50%;background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23FFF4DE' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 8.5 7 11.5 12 5'/></svg>") center/11px no-repeat;margin-top:1px}
.pc .foot{margin-top:auto;border-top:2px dashed rgba(31,20,9,.45);padding-top:15px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.pc .pr{font-family:var(--serif);font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1}
.pc .us{font-size:12.5px;font-weight:500;margin-top:5px;color:rgba(31,20,9,.75)}
.go{flex:none;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;transition:transform .3s var(--ease)}
.pc:hover .go{transform:rotate(-45deg) scale(1.08)}
.go svg{width:22px}

.tab{background:var(--card);color:var(--ink);border-radius:var(--r);overflow:hidden;font-size:13px;box-shadow:6px 6px 0 var(--mango)}
.tr{display:grid;grid-template-columns:1.5fr repeat(3,.75fr);align-items:center}
.tr>div{padding:12px 10px;border-bottom:1.5px solid rgba(31,20,9,.14);min-height:46px;display:flex;align-items:center}
.tr>div:not(:first-child){justify-content:center;text-align:center;border-left:1.5px solid rgba(31,20,9,.14);font-weight:700}
.tr.hd>div{background:var(--ink);color:var(--paper);font-weight:700;font-size:11.5px;border-color:rgba(255,255,255,.14)}
.tr.hd>div:nth-child(2){background:var(--mango);color:var(--ink)}.tr.hd>div:nth-child(3){background:var(--pink);color:var(--ink)}.tr.hd>div:nth-child(4){background:var(--mint);color:var(--ink)}
.tr:last-child>div{border-bottom:0}
.tr .y{width:22px;height:22px;border-radius:50%;background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23FFF4DE' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 8.5 7 11.5 12 5'/></svg>") center/13px no-repeat}
.tr .x{color:rgba(31,20,9,.25)}
.tr.pr>div{background:rgba(255,182,39,.28);font-weight:800;font-size:13px}
.homefoot{text-align:center;padding:60px 20px 10px;font-family:var(--serif);font-style:italic;font-size:24px;color:rgba(255,244,222,.8);line-height:1.3}
.credit{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:rgba(255,244,222,.45);padding:18px 0 4px;text-transform:uppercase}

/* ---------- PLAN VIEW ---------- */
nav{position:sticky;top:0;z-index:100;background:rgba(255,244,222,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
nav .in{max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--card);border-radius:99px;padding:7px 14px 7px 10px}
.back:active{scale:.95}.back svg{width:16px}
.mc{width:26px;height:36px;flex:none}
.mc-liq{transform:translateY(calc(34px - var(--p,0)*28px))}
.sw{display:flex;gap:7px}
.sw a{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;text-decoration:none;font-family:var(--mono);font-size:12px;font-weight:500;background:var(--card);transition:.2s}
.sw a.cur{background:var(--ink);color:var(--paper)}

.ph{position:relative;background:var(--acc);overflow:hidden;padding-bottom:36px}
.ph .wrap{display:grid;gap:18px;padding-top:34px;padding-bottom:20px;position:relative}
.ph .num{position:absolute;right:-4px;top:-10px;font-family:var(--serif);font-size:clamp(170px,50vw,400px);font-weight:800;letter-spacing:-.07em;line-height:.9;color:transparent;-webkit-text-stroke:2px rgba(31,20,9,.18);pointer-events:none}
.ph .copy{position:relative;z-index:2}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tags span{border:2px solid var(--ink);border-radius:99px;padding:5px 13px;font-weight:700;font-size:12px;background:var(--card)}
.tags span+span{background:var(--ink);color:var(--paper);font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:11px;padding-top:6px}
.ph h1{font-size:clamp(40px,11.4vw,92px);font-weight:800;line-height:.93;letter-spacing:-.04em;margin-bottom:20px}
.ph h1 em{font-weight:500;letter-spacing:-.02em}
.ph p.bl{max-width:540px;font-size:clamp(16px,4.2vw,19px);line-height:1.5;font-weight:450}
.ph .art{height:clamp(260px,72vw,400px);margin-top:0}
.ph .art::before{background:rgba(255,252,244,.55);box-shadow:none;border:2.5px solid var(--ink);width:min(64vw,330px)}
.ph .art .cupv{height:90%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:2}
.stats div{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:13px 15px;box-shadow:3px 3px 0 var(--ink)}
.stats small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.stats span{font-family:var(--serif);font-size:22px;font-weight:800;letter-spacing:-.03em}

main{max-width:1040px;margin:auto;padding:10px 20px 150px}
.sec{padding-top:64px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.sh .n{flex:none;font-family:var(--mono);font-size:12px;font-weight:500;background:var(--ink);color:var(--paper);border-radius:99px;padding:5px 11px}
.sh h3{font-size:clamp(32px,8.6vw,52px);font-weight:800;letter-spacing:-.035em;line-height:.95}
.sh h3 em{color:var(--tang);letter-spacing:-.02em}
.sh::after{content:'';flex:1;min-width:16px;border-top:2px dashed rgba(31,20,9,.3)}

.intro p.l{font-family:var(--serif);font-size:clamp(26px,6.8vw,40px);line-height:1.15;letter-spacing:-.015em;margin-bottom:20px;max-width:760px;font-weight:400}
.intro p.l mark{background:linear-gradient(transparent 58%,var(--acc) 58%);color:inherit;padding:0 2px;font-style:italic}
.intro p.s{color:var(--mut);max-width:560px;font-size:15.5px;line-height:1.7}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
.box{position:relative;border:2px solid var(--ink);border-radius:var(--r);padding:20px 20px 22px;background:var(--card);box-shadow:4px 4px 0 var(--ink);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s}
.box:nth-child(3n+1){background:color-mix(in srgb,var(--acc) 38%,var(--card))}
.box:nth-child(3n){background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.box .pn{position:absolute;right:14px;top:4px;font-family:var(--serif);font-style:italic;font-size:64px;font-weight:300;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(31,20,9,.3)}
.box h4{font-family:var(--serif);font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 7px;position:relative}
.box p{font-size:14px;line-height:1.6;color:rgba(31,20,9,.78);position:relative;max-width:92%}
@media(hover:hover){.box:hover{transform:translate(-3px,-3px) rotate(-.5deg);box-shadow:8px 8px 0 var(--ink)}}

.steps{position:relative;--sp:0}
.steps::before{content:'';position:absolute;left:22px;top:24px;bottom:34px;border-left:2.5px dashed rgba(31,20,9,.28)}
.steps::after{content:'';position:absolute;left:21px;top:24px;width:5px;border-radius:5px;background:var(--deep);height:calc((100% - 58px)*var(--sp))}
.step{display:grid;grid-template-columns:46px 1fr;gap:14px;position:relative;z-index:1;padding-bottom:18px}
.dot{width:46px;height:46px;border-radius:50%;background:var(--card);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:20px;box-shadow:2px 2px 0 var(--ink);transition:background .5s .2s}
.step.in .dot{background:var(--acc)}
.step .c{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px 16px}
.step h4{font-size:17.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.step p{font-size:14px;color:var(--mut);line-height:1.6}

.techn{color:var(--mut);margin-bottom:20px;max-width:560px;font-size:15px}

const MINI=(p)=>`<svg class="mc" viewBox="0 0 26 36" aria-hidden="true"><defs><clipPath id="mc${p.n}"><path d="M3 7H23L21 32Q21 34 19 34H7Q5 34 5 32Z"/></clipPath></defs><path d="M15 2L17 8" stroke="#1F1409" stroke-width="2.5" stroke-linecap="round"/><g clip-path="url(#mc${p.n})"><rect x="0" y="0" width="26" height="40" fill="#FFFCF4"/><rect class="mc-liq" x="0" y="0" width="26" height="40" fill="${p.deep}"/></g><path d="M3 7H23L21 32Q21 34 19 34H7Q5 34 5 32Z" fill="none" stroke="#1F1409" stroke-width="2.4" stroke-linejoin="round"/></svg>`;

/* ---------- HOME ---------- */
function home(){
 const items=['Smoothies','Parfaits','Sandwiches','Small chops'];
 const mq=Array(8).fill(0).map(()=>items.map(i=>`<span>${i}</span><b>✺</b>`).join('')).join('');
 const wm=SPLIT('Smoothie',0)+'<br><em class="dd">'+SPLIT('Daddi',8)+'<svg class="sq" viewBox="0 0 300 24" preserveAspectRatio="none"><path pathLength="1" d="M4 12Q29 0 54 12T104 12T154 12T204 12T254 12T296 12"/></svg></em>';
 const cards=P.map(p=>`<a class="pc rv" href="#${p.n}" style="--acc:${p.acc};--deep:${p.deep}"><div class="pc-art"><span class="big">0${p.n}</span><span class="fl">${p.fl}</span>${CUPL({id:'p'+p.n,liq:p.deep,liq2:p.acc,lv:p.lv,lid:p.n==3?'#FFB627':p.n==2?'#8ED6A8':'#FF8FA3'})}</div><div class="pc-body"><span class="tg">${p.tag}</span><h3>${p.name}</h3><p class="b">${p.blurb.split('. ')[0].replace(/\.$/,'')}.</p><ul>${p.extra.slice(0,3).map(e=>`<li>${e}</li>`).join('')}</ul><div class="foot"><div><div class="pr" data-count="${p.price}">${N(p.price)}</div><div class="us">≈ ${p.usd} USD · ${p.wk} weeks</div></div><span class="go">${ARROW}</span></div></div></a>`).join('');
 const dots=P.map((p,i)=>`<button aria-label="Plan ${i+1}" class="${i?'':'on'}"></button>`).join('');
 const cell=v=>v===1?'<span class="y"></span>':v===0?'<span class="x">-</span>':v;
 const tbl=`<div class="tab rv"><div class="tr hd"><div>What you get</div><div>Starter</div><div>Growth</div><div>Complete</div></div>${CMP.map(r=>`<div class="tr"><div>${r[0]}</div>${r.slice(1).map(v=>`<div>${cell(v)}</div>`).join('')}</div>`).join('')}<div class="tr pr"><div>Investment</div>${P.map(p=>`<div>${N(p.price)}</div>`).join('')}</div></div>`;
 return `<div class="top"><span class="pill"><i></i>Proposal · Oct 2026</span><span class="mono">By David Ajibua</span></div>
 <section class="hero"><div class="copy"><p class="kick rv">Website development proposal</p><h1 class="mark" aria-label="Smoothie Daddi">${wm}</h1><p class="addr rv">📍 Shop 6, OPH Complex, LUTH · Idi-Araba, Lagos</p><p class="lead rv">Three ways to take Smoothie Daddi online: from a simple WhatsApp-order showroom to a full ordering system with accounts and payment tracking. Pick the one that fits where the business is headed.</p><button class="cta1 rv" onclick="document.getElementById('plans').scrollIntoView({behavior:'smooth'})">See the three blends<span>${DOWN}</span></button></div>
 <div class="art" data-fx>${FX('orange','left:2%;top:4%;width:21%;--k:1.2;--r:-12deg')}${FX('strawberry','right:4%;top:2%;width:19%;--k:.8;--r:14deg;--d:1s')}${FX('mango','left:0;bottom:6%;width:23%;--k:1.5;--r:10deg;--d:.5s')}${FX('mint','right:20%;bottom:0;width:20%;--k:.6;--r:-18deg;--d:1.6s')}${CUPL({id:'hero',liq:'#F08A00',liq2:'#FFB627',lv:.88,cls:'hc'})}${BADGE}</div></section>
 <div class="marq"><div>${mq}</div></div>
 <section class="panel" id="plans"><div class="pin"><h2 class="h2 rv">Pick your <em>blend</em></h2><p class="sub2 rv">Swipe through the three plans. The fuller the cup, the more the website does.</p><div class="rail" id="rail">${cards}</div><div class="dots" id="dots">${dots}</div>
 <h2 class="h2 rv" style="margin-top:76px">Side by <em>side</em></h2><p class="sub2 rv">A quick look at what each plan covers.</p>${tbl}
 <p class="homefoot rv">All three plans include 12 months free maintenance and domain setup.</p><p class="credit">Smoothie Daddi · Prepared by David Ajibua · Oct 14, 2026</p></div></section>`;
}

/* ---------- PLAN VIEW ---------- */
function build(p){
 const base=['Custom 6-page branded website design','Mobile-first responsive layout','Photo-forward menu with categories','Smoothie Daddi mascot and brand styling throughout','Domain name setup and hosting deployment','12 months free maintenance','Up to 2 rounds of design revisions'];
 const feats=[...p.extra.map(f=>[f,1]),...base.map(f=>[f,0])].map(([f,h])=>`<div class="f rv ${h?'hl':''}"><span>${f}</span></div>`).join('');
 const terms=['A 50% deposit is required before work begins.','Up to 2 rounds of revisions are included in the agreed scope.','12 months of free maintenance starts on delivery and covers bug fixes, minor content updates and performance checks. Major new features are quoted separately.','Domain cost (about $15 per year) is the owner\'s responsibility from year 2.','The owner provides all content: menu photos, prices, descriptions and logo.'];
 if(p.n>=2)terms.push('Hosting, database and email services start on free tiers. If usage grows beyond them, the owner covers those subscription costs.');
 if(p.n==3){terms.push('The chatbot answers from a menu knowledge base the owner reviews and approves before launch.');terms.push('Chatbot usage is billed per message by the AI provider and is paid by the owner.');}
 const dep=p.price/2;
 const sw=P.map(q=>`<a href="#${q.n}" class="${q.n==p.n?'cur':''}" aria-label="Proposal ${q.n}">0${q.n}</a>`).join('');
 const fruits=[['orange','left:2%;top:6%;width:20%;--k:1.2;--r:-14deg'],['mango','right:3%;top:4%;width:21%;--k:.9;--r:12deg;--d:1s'],['strawberry','left:4%;bottom:4%;width:18%;--k:1.4;--r:8deg;--d:.6s'],['mint','right:6%;bottom:6%;width:20%;--k:.7;--r:-16deg;--d:1.4s']];
 const fr=p.n==1?[fruits[1],fruits[3],fruits[0]]:p.n==2?[fruits[2],fruits[0],fruits[3]]:[fruits[3],fruits[1],fruits[2]];
 return `<nav><div class="in"><a class="back" href="#home">${BACK}All plans</a>${MINI(p)}<div class="sw">${sw}</div></div></nav>
 <header class="ph" style="--acc:${p.acc};--deep:${p.deep}"><div class="wrap"><span class="num">0${p.n}</span>
 <div class="copy"><div class="tags"><span>Proposal 0${p.n} · ${p.tag}</span><span>${p.fl}</span></div><h1 aria-label="${p.name}">${SPLIT(p.name)}</h1><p class="bl rv">${p.blurb}</p></div>
 <div class="art" data-fx>${fr.map(f=>FX(f[0],f[1])).join('')}${CUPL({id:'h'+p.n,liq:p.deep,liq2:p.acc,lv:p.lv,lid:p.n==3?'#FFB627':p.n==2?'#8ED6A8':'#FF8FA3'})}</div>
 <div class="stats"><div class="rv"><small>Investment</small><span>${N(p.price)}</span></div><div class="rv"><small>Timeline</small><span>${p.wk} weeks</span></div><div class="rv"><small>Maintenance</small><span>12 mo. free</span></div><div class="rv"><small>Domain</small><span>Included</span></div></div></div>
 ${WAVE('#FFF4DE','bottom:-1px')}</header>
 <main style="--acc:${p.acc};--deep:${p.deep}">
 ${S('01','Introduction',`<div class="intro"><p class="l rv">Smoothie Daddi serves <mark>health-conscious customers</mark> near LUTH with smoothies, fruity parfaits, sandwiches and small chops.</p><p class="s rv">Right now, orders happen through Instagram and WhatsApp. This website gives the brand a real home online, somewhere customers can browse the full menu, see what's available, and order with confidence.</p><p class="s rv" style="margin-top:12px">It's built to feel as fresh and friendly as the brand itself, and to make ordering easy whether it's a regular inside LUTH or someone discovering Smoothie Daddi for the first time.</p></div>`)}
 ${S('02','Pages and Structure',`<div class="grid">${p.pages.map(([a,b],i)=>`<div class="box rv"><span class="pn">0${i+1}</span><h4>${a}</h4><p>${b}</p></div>`).join('')}</div>`)}
 ${S('03','How Ordering Works',`<div class="steps">${p.pay.map(([a,b],i)=>`<div class="step rv"><div class="dot">${i+1}</div><div class="c"><h4>${a}</h4><p>${b}</p></div></div>`).join('')}</div>`)}
 ${S('04','Technology Stack',`<p class="techn rv">A modern, reliable stack that keeps pages fast and the site easy to maintain as the menu grows.</p><div class="chips">${p.tech.map(([a,b])=>`<div class="chip rv"><b>${a}</b><small>${b}</small></div>`).join('')}</div>`)}
 ${S('05','What is Included',`<div class="feats">${feats}</div>`)}
 ${S('06','Estimated Timeline',`<div class="tl">${p.tl.map(([a,b])=>`<div class="rv"><b>${a}</b><p>${b}</p></div>`).join('')}</div>`)}
 ${S('07','Investment',`<div class="ticket rv"><div class="t-top"><span>Estimate · SD-0${p.n}</span><span>14 Oct 2026</span></div>${p.bd.map(([a,b,c])=>`<div class="row"><b>${a}</b><em class="p">${N(c)}</em><span>${b}</span></div>`).join('')}<div class="row free"><b>12 Months Support</b><em class="p"><span class="fb">INCLUDED</span></em><span>Bug fixes, minor content updates and performance checks</span></div><div class="perf"></div><div class="tot"><small>Total investment · ${p.usd} USD</small><div class="n" data-count="${p.price}">${N(p.price)}</div><p>Domain setup and 12 months support included · ${p.wk} weeks delivery</p></div></div>
 <div class="plan rv"><div><small>Deposit · 50%</small><b>${N(dep)}</b><span>Before work begins</span></div><div><small>Balance · 50%</small><b>${N(dep)}</b><span>Upon delivery</span></div></div>`)}
 ${S('08','Terms and Conditions',`<div class="terms">${terms.map(t=>`<div class="t rv"><span>${t}</span></div>`).join('')}</div>`)}
 ${S('09','Next Steps',`<div class="cta rv" data-fx>${FX('mango','right:-14px;top:-12px;width:96px;--k:.5;--r:18deg')}${FX('strawberry','right:50px;bottom:-26px;width:70px;--k:.8;--r:-12deg;--d:1s')}<h3>Ready when <em>you are.</em></h3><p class="s">To proceed, confirm your chosen plan and make the initial deposit. Work begins right away. Questions before committing? Reach out anytime.</p><div class="btns"><a class="btn m" href="${wa(p)}" target="_blank" rel="noopener">${WA}Start on WhatsApp</a><a class="btn o" href="mailto:davidajibua78@gmail.com?subject=${encodeURIComponent('Smoothie Daddi website · '+p.tag+' plan')}">Send an email</a></div><div class="ci"><div><small>Developer</small>David Ajibua</div><div><small>Date issued</small>October 14, 2026</div><div><small>Phone and WhatsApp</small>07068634125</div><div class="w2"><small>Email</small>davidajibua78@gmail.com</div></div></div>`)}
 </main><footer>SMOOTHIE DADDI · PROPOSAL 0${p.n} · PREPARED BY DAVID AJIBUA</footer>`;
}

document.getElementById('home').innerHTML=home();
P.forEach(p=>document.getElementById('v'+p.n).innerHTML=build(p));

/* ---------- behaviour ---------- */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const R=document.documentElement,bar=document.getElementById('bar'),W=document.getElementById('wipe'),prog=document.getElementById('prog');
let cur=null,busy=false;

function count(el){const to=+el.dataset.count;if(reduce){return}const t0=performance.now(),d=1500;(function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,4);el.textContent=N(k>=1?to:Math.round(to*e/100)*100);if(k<1)requestAnimationFrame(f)})(t0)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add('in');io.unobserve(t);if(t.dataset.count&&!t.dataset.cd){t.dataset.cd=1;count(t)}setTimeout(()=>{t.style.transitionDelay=''},1600)}),{threshold:.08,rootMargin:'0px 0px -5% 0px'});

function show(id){
 cur=id;
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
 const v=document.getElementById(id);v.classList.add('on');window.scrollTo(0,0);
 v.querySelectorAll('.rv:not(.in),.cupv:not(.in),[data-count]:not([data-cd])').forEach(el=>{if(el.classList.contains('rv')){const i=[...el.parentNode.children].indexOf(el);el.style.transitionDelay=Math.min(i,5)*70+'ms'}io.observe(el)});
 const p=P.find(q=>'v'+q.n===id);
 if(p){bar.style.setProperty('--acc',p.acc);bar.innerHTML=`<div><small>${p.tag} plan</small><b>${N(p.price)}</b></div><a href="${wa(p)}" target="_blank" rel="noopener">Start this plan →</a>`;requestAnimationFrame(()=>bar.classList.add('show'))}
 else bar.classList.remove('show');
 upd();
}
function target(){const h=location.hash.replace('#','');return['1','2','3'].includes(h)?'v'+h:'home'}
function route(first){
 const id=target();
 if(first||reduce){show(id);return}
 if(busy||id===cur)return;
 busy=true;
 const p=P.find(q=>'v'+q.n===id);
 W.style.background=p?p.acc:'#1F1409';W.style.color=p?'#1F1409':'#FFF4DE';
 W.innerHTML=`<span>${p?p.tag:'Smoothie <em>Daddi</em>'}</span>`;
 W.className='wipe in';
 setTimeout(()=>{show(id);W.className='wipe out'},520);
 setTimeout(()=>{W.className='wipe';busy=false;if(target()!==cur)route()},1300);
}
addEventListener('hashchange',()=>route());

/* scroll + parallax */
let tick=false;
function upd(){
 tick=false;
 const h=document.documentElement,p=scrollY/((h.scrollHeight-innerHeight)||1);
 prog.style.width=(p*100).toFixed(2)+'%';
 const v=document.querySelector('.view.on');if(!v)return;
 const mc=v.querySelector('.mc');if(mc)mc.style.setProperty('--p',p.toFixed(3));
 v.querySelectorAll('.steps').forEach(s=>{const r=s.getBoundingClientRect();s.style.setProperty('--sp',Math.max(0,Math.min(1,(innerHeight*.62-r.top)/r.height)).toFixed(3))});
 v.querySelectorAll('[data-fx]').forEach(f=>f.style.setProperty('--sy',f.classList.contains('cta')?0:Math.min(scrollY,900).toFixed(0)));
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
let tx=0,ty=0,cx=0,cy=0;
const setT=(x,y)=>{tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y))};
addEventListener('pointermove',e=>setT((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2),{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;setT(e.gamma/28,(e.beta-50)/28)},{passive:true});
if(!reduce)(function loop(){cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;if(Math.abs(tx-cx)+Math.abs(ty-cy)>.002){document.querySelectorAll('.view.on [data-fx]').forEach(f=>{f.style.setProperty('--px',cx.toFixed(3));f.style.setProperty('--py',cy.toFixed(3))})}requestAnimationFrame(loop)})();

/* carousel dots */
const rail=document.getElementById('rail'),dots=[...document.querySelectorAll('#dots button')];
rail.addEventListener('scroll',()=>{const c=rail.children[0];const w=c.offsetWidth+18;const i=Math.max(0,Math.min(2,Math.round(rail.scrollLeft/w)));dots.forEach((d,k)=>d.classList.toggle('on',k===i))},{passive:true});
dots.forEach((d,i)=>d.addEventListener('click',()=>rail.scrollTo({left:i*(rail.children[0].offsetWidth+18),behavior:'smooth'})));

/* desktop tilt */
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
 document.querySelectorAll('.pc').forEach(c=>{
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--ry',(((e.clientX-r.left)/r.width-.5)*9).toFixed(2)+'deg');c.style.setProperty('--rx',(-((e.clientY-r.top)/r.height-.5)*9).toFixed(2)+'deg')});
  c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')});
 });
}

/* tap splashes */
function burst(x,y){if(reduce)return;const cols=['#FFB627','#FF5E34','#8ED6A8','#FFA3B5'];for(let i=0;i<8;i++){const s=document.createElement('i');s.className='sp';s.style.left=x+'px';s.style.top=y+'px';s.style.background=cols[i%4];document.body.appendChild(s);const a=Math.random()*6.28,d=38+Math.random()*52;s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`,opacity:0}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>s.remove()}}
addEventListener('pointerdown',e=>{if(e.target.closest('.pc,.btn,.back,.sw a,#bar a,.cta1')){burst(e.clientX,e.clientY);if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}}},{passive:true});

/* intro */
const sp=document.getElementById('splash');
route(true);
if(reduce){sp.remove();document.body.classList.add('ready')}
else{
 sp.innerHTML=`<div class="sp-in">${CUPL({id:'spl',liq:'#FFB627',liq2:'#FF5E34',lv:.92,cls:'sp-cup'})}<p class="sp-t">Smoothie <em>Daddi</em></p><p class="sp-s">Blending your proposal</p></div>`;
 let done=false;
 const finish=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>document.body.classList.add('ready'),380);setTimeout(()=>sp.remove(),1200)};
 requestAnimationFrame(()=>requestAnimationFrame(()=>sp.querySelector('.cupv').classList.add('in')));
 setTimeout(finish,2500);
}
</script></body></html>
