<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4DE">
<title>Smoothie Daddi | Website Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF4DE;--card:#FFFCF4;--ink:#22160B;--mut:#6B5840;
  --mango:#FFB627;--tang:#FF6B3D;--mint:#8ED6A8;--pink:#FFB3C1;
  --acc:var(--mango);
  --sh:5px 5px 0 var(--ink);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:16px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:300;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.mono{font-family:'DM Mono',monospace}
a{color:inherit}
#prog{position:fixed;top:0;left:0;height:4px;width:0;background:var(--tang);z-index:400;border-radius:0 4px 4px 0}

.view{display:none;min-height:100vh}
.view.on{display:block;animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wrap{max-width:1040px;margin:auto;padding:0 20px}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- HOME ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px 0;max-width:1040px;margin:auto;font-size:12px}
.top .mono{letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:99px;padding:6px 13px;background:var(--card);font-weight:600;font-size:12px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--tang);display:block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

.hero{position:relative;padding:34px 20px 50px;max-width:1040px;margin:auto}
.kick{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mark{font-size:clamp(64px,21vw,190px);font-weight:800;line-height:.82;letter-spacing:-.055em;margin:16px 0 18px}
.mark em{font-size:1.04em;letter-spacing:-.03em;position:relative;display:inline-block;color:var(--tang)}
.mark em::after{content:'';position:absolute;left:-2%;right:-2%;bottom:.04em;height:.11em;background:var(--mango);z-index:-1;border-radius:99px;transform:rotate(-1.5deg)}
.addr{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--mut);font-size:14px;margin-bottom:18px}
.lead{max-width:520px;font-size:clamp(18px,4.6vw,23px);line-height:1.4;font-weight:450}
.hero .cup{position:absolute;right:6px;top:8px;width:clamp(86px,22vw,210px);transform:rotate(9deg);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(3deg) translateY(-10px)}}
.badge{position:absolute;right:calc(clamp(86px,22vw,210px) - 30px);top:clamp(118px,27vw,250px);width:clamp(78px,18vw,128px);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.marq{background:var(--ink);color:var(--mango);border-block:2px solid var(--ink);overflow:hidden;white-space:nowrap;transform:rotate(-1.4deg);margin:14px -10px 0}
.marq div{display:inline-block;padding:13px 0;font-weight:700;font-size:20px;animation:mq 26s linear infinite;letter-spacing:-.01em}
.marq span{margin:0 18px}.marq b{color:var(--cream,#FFF4DE);font-weight:400;font-family:'Instrument Serif';font-style:italic}
@keyframes mq{to{transform:translateX(-50%)}}

.plans{padding:70px 20px 20px;max-width:1040px;margin:auto}
.h2{font-size:clamp(34px,9vw,58px);font-weight:800;line-height:.95;letter-spacing:-.04em;margin-bottom:8px}
.sub2{color:var(--mut);margin-bottom:28px;font-size:15px}
.cards{display:grid;gap:22px}
.pc{position:relative;display:flex;flex-direction:column;background:var(--acc);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:24px 22px 22px;text-decoration:none;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pc:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.pc:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pc .big{position:absolute;right:-8px;top:-18px;font-size:150px;font-weight:800;letter-spacing:-.06em;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(34,22,11,.22);pointer-events:none}
.pc .tg{align-self:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:4px 13px;font-size:12px;font-weight:700;margin-bottom:18px;position:relative}
.pc h3{font-size:27px;line-height:1.02;font-weight:800;letter-spacing:-.03em;margin-bottom:12px;position:relative;max-width:88%}
.pc p.b{font-size:14.5px;line-height:1.55;margin-bottom:16px;color:rgba(34,22,11,.82)}
.pc ul{list-style:none;display:grid;gap:7px;margin-bottom:20px;font-size:13.5px;font-weight:600}
.pc li{display:flex;gap:9px;align-items:flex-start}
.pc li::before{content:'';flex:none;width:17px;height:17px;border-radius:50%;background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23FFF4DE' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 8.5 7 11.5 12 5'/></svg>") center/11px no-repeat;margin-top:1px}
.pc .foot{margin-top:auto;border-top:2px dashed rgba(34,22,11,.45);padding-top:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.pc .pr{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.pc .us{font-size:12.5px;font-weight:500;margin-top:5px;color:rgba(34,22,11,.75)}
.go{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;transition:transform .25s}
.pc:hover .go{transform:rotate(-45deg) scale(1.06)}
.go svg{width:22px}

.cmp{padding:60px 20px 20px;max-width:1040px;margin:auto}
.tab{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;font-size:13px}
.tr{display:grid;grid-template-columns:1.5fr repeat(3,.75fr);align-items:center}
.tr>div{padding:12px 10px;border-bottom:1.5px solid rgba(34,22,11,.14);min-height:46px;display:flex;align-items:center}
.tr>div:not(:first-child){justify-content:center;text-align:center;border-left:1.5px solid rgba(34,22,11,.14);font-weight:700}
.tr.hd>div{background:var(--ink);color:var(--paper);font-weight:700;font-size:11.5px;border-color:rgba(255,255,255,.14)}
.tr.hd>div:nth-child(2){background:var(--mango);color:var(--ink)}.tr.hd>div:nth-child(3){background:var(--pink);color:var(--ink)}.tr.hd>div:nth-child(4){background:var(--mint);color:var(--ink)}
.tr:last-child>div{border-bottom:0}
.tr .y{width:22px;height:22px;border-radius:50%;background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23FFF4DE' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 8.5 7 11.5 12 5'/></svg>") center/13px no-repeat}
.tr .x{color:rgba(34,22,11,.25)}
.tr.pr>div{background:rgba(255,182,39,.2);font-weight:800;font-size:13px}
.homefoot{text-align:center;padding:44px 20px 70px;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:var(--mut)}

/* ---------- PLAN VIEW ---------- */
nav{position:sticky;top:0;z-index:100;background:rgba(255,244,222,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
nav .in{max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--card);border-radius:99px;padding:7px 14px 7px 10px;transition:.2s}
.back:active{transform:scale(.95)}.back svg{width:16px}
.sw{display:flex;gap:7px}
.sw a{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;text-decoration:none;font-family:'DM Mono';font-size:12px;font-weight:500;background:var(--card);transition:.2s}
.sw a.cur{background:var(--ink);color:var(--paper)}

.ph{position:relative;background:var(--acc);border-bottom:2px solid var(--ink);overflow:hidden}
.ph .wrap{padding-top:44px;padding-bottom:56px;position:relative}
.ph .num{position:absolute;right:-6px;top:-4px;font-size:clamp(150px,44vw,360px);font-weight:800;letter-spacing:-.07em;line-height:.9;color:transparent;-webkit-text-stroke:2px rgba(34,22,11,.2);pointer-events:none}
.ph .kick{color:rgba(34,22,11,.75);position:relative}
.ph h1{font-size:clamp(38px,10.5vw,84px);font-weight:800;line-height:.94;letter-spacing:-.05em;margin:14px 0 18px;max-width:780px;position:relative}
.ph p.bl{max-width:560px;font-size:clamp(16px,4vw,19px);line-height:1.5;font-weight:450;position:relative}
.ph .cup{position:absolute;right:14px;bottom:-22px;width:clamp(80px,19vw,170px);transform:rotate(-9deg);animation:bob2 5s ease-in-out infinite}
@keyframes bob2{50%{transform:rotate(-3deg) translateY(-8px)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px;position:relative;max-width:640px}
.stats div{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:13px 15px;box-shadow:3px 3px 0 var(--ink)}
.stats small{display:block;font-family:'DM Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.stats span{font-size:19px;font-weight:800;letter-spacing:-.03em}

main{max-width:1040px;margin:auto;padding:20px 20px 150px}
.sec{padding-top:62px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.sh .n{flex:none;font-family:'DM Mono';font-size:12px;font-weight:500;background:var(--ink);color:var(--paper);border-radius:99px;padding:5px 11px}
.sh h3{font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.sh h3 em{font-size:1.08em;color:var(--tang);letter-spacing:-.02em}
.sh::after{content:'';flex:1;min-width:20px;height:0;border-top:2px dashed rgba(34,22,11,.35)}

.intro p.l{font-family:'Instrument Serif',serif;font-size:clamp(25px,6.4vw,38px);line-height:1.18;letter-spacing:-.01em;margin-bottom:20px;max-width:760px}
.intro p.l mark{background:linear-gradient(transparent 58%,var(--acc) 58%);color:inherit;padding:0 2px}
.intro p.s{color:var(--mut);max-width:560px;font-size:15.5px;line-height:1.7}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
.box{border:2px solid var(--ink);border-radius:var(--r);padding:20px;background:var(--card);box-shadow:4px 4px 0 var(--ink);transition:transform .25s}
.box:nth-child(3n+1){background:color-mix(in srgb,var(--acc) 38%,var(--card))}
.box:nth-child(3n+2){background:var(--card)}
.box:nth-child(3n){background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.box:hover{transform:translate(-2px,-2px) rotate(-.4deg)}
.box .pn{font-family:'DM Mono';font-size:11px;color:var(--mut);letter-spacing:.06em}
.box h4{font-size:24px;font-weight:800;letter-spacing:-.035em;margin:5px 0 7px}
.box p{font-size:14px;line-height:1.6;color:rgba(34,22,11,.78)}

.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:46px 1fr;gap:14px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:'';position:absolute;left:22px;top:48px;bottom:-2px;border-left:2px dashed rgba(34,22,11,.4)}
.dot{width:46px;height:46px;border-radius:50%;background:var(--acc);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:2px 2px 0 var(--ink);z-index:1}
.step .c{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px 16px}
.step h4{font-size:17.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.step p{font-size:14px;color:var(--mut);line-height:1.6}

.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 16px;box-shadow:3px 3px 0 var(--ink);transition:transform .25s}
.chip:nth-child(odd){transform:rotate(-1.6deg)}.chip:nth-child(even){transform:rotate(1.2deg);background:color-mix(in srgb,var(--acc) 40%,var(--card))}
.chip:hover{transform:rotate(0) translateY(-3px)}
.chip b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}.chip small{font-family:'DM Mono';font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.techn{color:var(--mut);margin-bottom:20px;max-width:560px;font-size:15px}

.feats{display:grid;grid-template-columns:1fr;gap:10px}
.f{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:2px solid var(--ink);border-radius:16px;background:var(--card);font-size:14.5px;font-weight:550;line-height:1.45}
.f::before{content:'';flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2322160B' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 8.5 7 11.5 12 5'/></svg>") center/13px no-repeat;border:2px solid var(--ink)}
.f.hl{background:color-mix(in srgb,var(--acc) 30%,var(--card))}

.tl{display:grid;gap:14px;grid-template-columns:1fr}
.tl div{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px 18px 16px;overflow:hidden}
.tl div::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--acc);border-right:2px solid var(--ink)}
.tl b{display:block;padding-left:10px;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:28px;line-height:1;margin-bottom:6px}
.tl p{padding-left:10px;font-size:14px;color:var(--mut);line-height:1.55}

/* receipt */
.ticket{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);max-width:680px}
.t-top{display:flex;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:2px dashed rgba(34,22,11,.4);font-family:'DM Mono';font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:14px 20px;border-bottom:1.5px solid rgba(34,22,11,.12)}
.row b{font-size:16px;font-weight:800;letter-spacing:-.02em}.row em.p{font-family:'DM Mono',monospace;font-style:normal;font-weight:500;font-size:14.5px;text-align:right;align-self:start}
.row span{grid-column:1/-1;font-size:13px;color:var(--mut);line-height:1.5}
.row.free{background:color-mix(in srgb,var(--mint) 35%,var(--card))}
.row.free s{color:var(--mut);margin-right:6px;font-family:'DM Mono';font-size:12.5px}
.fb{display:inline-block;background:var(--ink);color:var(--mint);font-family:'DM Mono';font-size:10.5px;font-weight:500;padding:3px 9px;border-radius:99px;transform:rotate(-4deg);letter-spacing:.06em}
.perf{position:relative;border-top:2px dashed var(--ink);margin-top:8px}
.perf::before,.perf::after{content:'';position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.perf::before{left:-15px;clip-path:inset(0 0 0 50%)}.perf::after{right:-15px;clip-path:inset(0 50% 0 0)}
.tot{padding:22px 20px 24px}
.tot small{font-family:'DM Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tot .n{font-size:clamp(46px,14vw,76px);font-weight:800;letter-spacing:-.06em;line-height:1;margin:8px 0 6px;display:inline-block;background:linear-gradient(transparent 62%,var(--acc) 62%)}
.tot p{font-size:13.5px;color:var(--mut)}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;max-width:680px}
.plan div{padding:16px;border:2px solid var(--ink);border-radius:18px;background:var(--acc);box-shadow:3px 3px 0 var(--ink)}
.plan div+div{background:var(--card)}
.plan small{font-family:'DM Mono';font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;display:block}
.plan b{display:block;font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:-.04em;margin:4px 0}
.plan span{font-size:12px;color:rgba(34,22,11,.7)}

.terms{display:grid;gap:10px;counter-reset:t;max-width:760px}
.terms .t{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:14px 16px;border:2px solid var(--ink);border-radius:16px;background:var(--card);font-size:14.5px;line-height:1.55;counter-increment:t}
.terms .t::before{content:counter(t,decimal-leading-zero);font-family:'DM Mono';font-size:12px;color:var(--tang);font-weight:500;padding-top:2px}

.cta{background:var(--ink);color:var(--paper);border-radius:28px;padding:34px 22px 26px;position:relative;overflow:hidden}
.cta h3{font-size:clamp(38px,11vw,72px);font-weight:800;letter-spacing:-.05em;line-height:.92;margin-bottom:12px}.cta h3 em{color:var(--mango)}
.cta p.s{color:rgba(255,244,222,.75);max-width:480px;font-size:15.5px;margin-bottom:22px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:15px;padding:14px 22px;border-radius:99px;border:2px solid var(--paper);transition:transform .2s}
.btn:active{transform:scale(.96)}.btn.m{background:var(--mint);color:var(--ink);border-color:var(--mint)}.btn.o{color:var(--paper)}
.btn svg{width:18px}
.ci{display:grid;gap:16px;grid-template-columns:1fr 1fr;border-top:2px dashed rgba(255,244,222,.3);padding-top:20px}
.ci small{display:block;font-family:'DM Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mango);margin-bottom:3px}
.ci div{font-size:14.5px;font-weight:600;word-break:break-word}.ci .w{grid-column:1/-1}
footer{text-align:center;padding:30px 20px 10px;font-family:'DM Mono';font-size:11px;color:var(--mut);letter-spacing:.04em}

/* sticky bar */
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:calc(100% - 24px);max-width:540px;z-index:200;background:var(--ink);color:var(--paper);border-radius:99px;padding:8px 8px 8px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 12px 30px -10px rgba(34,22,11,.6);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#bar.show{transform:translate(-50%,0)}
#bar small{display:block;font-family:'DM Mono';font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mango)}
#bar b{font-size:19px;font-weight:800;letter-spacing:-.03em}
#bar a{background:var(--acc);color:var(--ink);text-decoration:none;font-weight:800;font-size:14px;border-radius:99px;padding:13px 20px;white-space:nowrap}

@media(min-width:720px){
  .grid{grid-template-columns:1fr 1fr}.feats{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr);max-width:none}
  .tl{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .ci{grid-template-columns:repeat(4,1fr)}.ci .w{grid-column:auto}
  .tr{font-size:14px}.tr>div{padding:14px}
  main{padding-bottom:140px}
}
@media(min-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.pc:nth-child(2){margin-top:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head><body>
<div id="prog"></div>

<div id="home" class="view on"></div>

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -5% 0px'});
const bar=document.getElementById('bar');
function show(id){

 const v=document.getElementById(id);v.classList.add('on');window.scrollTo(0,0);
 v.querySelectorAll('.rv:not(.in)').forEach((el,i)=>{el.style.transitionDelay=(i%4)*60+'ms';io.observe(el)});
 const p=P.find(q=>'v'+q.n===id);
 if(p){bar.style.setProperty('--acc',p.acc);bar.innerHTML=`<div><small>${p.tag} plan</small><b>${N(p.price)}</b></div><a href="${wa(p)}" target="_blank" rel="noopener">Start this plan →</a>`;requestAnimationFrame(()=>bar.classList.add('show'))}
 else bar.classList.remove('show');
}
